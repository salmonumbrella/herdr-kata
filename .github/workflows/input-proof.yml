name: Input proof
on:
  push:
    branches: [proof/cron-input-delivery-s8-green]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.2'
      - run: gofmt -w internal/defs/defs.go internal/kata/fleet.go internal/kata/kata.go internal/kata/inputs_test.go internal/prompt/prompt.go internal/report/report.go internal/worker/inputs.go internal/worker/inputs_test.go internal/worker/worker.go internal/worker/worker_test.go
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: formatted-source
          path: |
            internal/defs/defs.go
            internal/kata/fleet.go
            internal/kata/kata.go
            internal/kata/inputs_test.go
            internal/prompt/prompt.go
            internal/report/report.go
            internal/worker/inputs.go
            internal/worker/inputs_test.go
            internal/worker/worker.go
            internal/worker/worker_test.go
      - run: go test -count=1 ./internal/worker ./internal/kata ./internal/defs ./internal/prompt ./internal/journal ./internal/report
        env:
          GOMAXPROCS: '2'
          GOFLAGS: '-p=2'
      - run: make docs-check
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: kenn-io/kata
          ref: 8e16b5e1411d47018341216de3516f1f5cdb056e
          path: _kata
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.4'
      - name: Check input conformance bridge
        run: |
          git -C _kata rev-parse HEAD
          sha256sum _kata/pkg/cron/conformance/testdata/adapter-v3/inputs.json
          cp proof/kit_bridge.txt internal/worker/kit_bridge_test.go
          go mod edit -go=1.27.4 -require=go.kenn.io/kata@v0.0.0 -replace=go.kenn.io/kata=./_kata
          go test -mod=mod -count=1 ./internal/worker -run '^TestInputConformanceKit$' -v
        env:
          GOMAXPROCS: '2'
          GOFLAGS: '-p=2'
