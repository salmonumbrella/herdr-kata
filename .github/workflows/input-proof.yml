name: Input proof
on:
  push:
    branches: [proof/cron-input-delivery-s8-green]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.2'
      - run: gofmt -w internal/defs/defs.go internal/kata/fleet.go internal/kata/kata.go internal/kata/inputs_test.go internal/prompt/prompt.go internal/report/report.go internal/worker/inputs.go internal/worker/inputs_test.go internal/worker/worker.go internal/worker/worker_test.go
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: formatted-source
          path: |
            internal/defs/defs.go
            internal/kata/fleet.go
            internal/kata/kata.go
            internal/kata/inputs_test.go
            internal/prompt/prompt.go
            internal/report/report.go
            internal/worker/inputs.go
            internal/worker/inputs_test.go
            internal/worker/worker.go
            internal/worker/worker_test.go
      - run: go test -count=1 ./internal/worker ./internal/kata ./internal/defs ./internal/prompt ./internal/journal ./internal/report
        env:
          GOMAXPROCS: '2'
          GOFLAGS: '-p=2'
      - run: make docs-check
