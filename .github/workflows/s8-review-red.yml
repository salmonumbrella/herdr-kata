name: Slice 8 review red
on:
  push:
    branches: [proof/s8-review1-red]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.2'
      - run: go test -count=1 ./internal/report -run '^TestUnlaunchedCancellationReason$'
        env:
          GOMAXPROCS: '2'
          GOFLAGS: '-p=2'
