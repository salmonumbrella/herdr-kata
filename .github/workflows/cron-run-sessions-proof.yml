name: Cron run sessions initial proof
on:
  push:
    branches: [proof/cron-run-sessions-report-ci]
permissions:
  contents: read
jobs:
  initial-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.2'
      - name: Run initial session assertion
        env:
          GOMAXPROCS: '2'
          GOFLAGS: '-p=1'
        run: |
          export HOME="$RUNNER_TEMP/synthetic-home"
          export XDG_CONFIG_HOME="$HOME/config" XDG_STATE_HOME="$HOME/state" XDG_RUNTIME_DIR="$HOME/runtime"
          unset CODEX_HOME CLAUDE_CONFIG_DIR PI_CODING_AGENT_DIR
          mkdir -p "$HOME" "$XDG_CONFIG_HOME" "$XDG_STATE_HOME" "$XDG_RUNTIME_DIR"
          go test ./internal/worker -run '^TestFleetFinalObservationIncludesRecordedSession$' -count=1
