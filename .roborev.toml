display_name = "herdr-kata"
agent = "codex"
model = "gpt-6.1-sol"
review_reasoning = "high"
review_guidelines = """
Small headless Kata adapter on herdr-core, Linux and macOS. No Windows.
Trusted Kata definition authors can execute commands and prompts. The hc
socket, config and state are owner-local. Do not flag same-user filesystem
attacks or trusted definition text as injection vulnerabilities.

Consent contracts (canonical list in AGENTS.md): on-disk state and every
Version; Kata reporting with cron-worker:<runUID>:issue, kata.* labels,
KATA_PROJECT, KATA_CRON_* variables, run_parent, observations and notifications; configuration keys;
install module github.com/salmonumbrella/herdr-kata, binary herdr-kata built
from ./cmd/herdr-kata to ./bin/herdr-kata; commands up serve stop run release
logs report exec-step doctor service version. The approved v2 rewrite drops the old
plugin manifest, panes and TUI. Approved spec/plan units consent to their
specified changes only.

Runtime invariants: lifetime single-writer lock; journal before occurrence
or request acknowledgement; confirmed admission before launch; frozen
observation bytes and stable keys. Save nonce/core intent before launch;
recover by labels and argv, never name alone. Lost/ambiguous execution holds;
never resend a prompt to a live terminal. Recheck core id, creation time
and nonce before interrupt/kill/rm; leave changed occupants alone and keep
held terminals. Pin project/daemon/actor on every Kata call. Retry only
keyed/replay-safe writes, read conflicts back, save notification intent
before calling and never retry uncertain notification. Existing issues
receive no writes. Set HC_SESSION and drop HC_SOCKET on every hc call;
explicit child environment prefix, no credentials in argv. Command success
requires a receipt and reason exited; termination forbids a receipt even
when trapped. At most 6,200 lines of non-test Go; the additional budget retains
immutable alert identity checks alongside fleet support.

Fleet adoption: known capabilities and a fresh successful unpaused job-list
read gate prepared admission. Request TTL ends at durable preparation.
Persist cancellation before cleanup or workflow completion; retain cancelled
terminals and preserve loss/ambiguity holds. Only a structured unsupported
feature conflict may replace frozen v2 bytes with a saved v1 projection before
keyed retry. Runtime beats are keyed, per-project and rate-limited.

Do not demand extra machinery for hypothetical edges. Do flag concrete
violations of the specified settlement/recovery tables. You have no network:
do not claim a pinned tool version, action SHA or checksum does not exist.
"""
